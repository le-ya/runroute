name: runroute

services:
    website:
        build:
            context: .
            dockerfile: deploy/website/Dockerfile
            args:
                PUBLIC_MAPTILER_KEY: ${PUBLIC_MAPTILER_KEY:-}
        ports:
            - '${WEBSITE_PORT:-8080}:8080'
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/health']
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    api:
        build:
            context: .
            dockerfile: services/api/Dockerfile
        environment:
            API_LISTEN_ADDRESS: ':8080'
            DATABASE_URL: postgresql://${POSTGRES_USER:-runroute}:${POSTGRES_PASSWORD:-runroute}@postgres-postgis:5432/${POSTGRES_DB:-runroute}?sslmode=disable
            ROUTE_ENGINE_ADDRESS: route-engine:50051
            GRAPHHOPPER_URL: http://graphhopper:8989
        depends_on:
            postgres-postgis:
                condition: service_healthy
            route-engine:
                condition: service_started
            graphhopper:
                condition: service_healthy
        healthcheck:
            test: ['CMD', '/api', 'healthcheck']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s
        restart: unless-stopped

    route-engine:
        build:
            context: .
            dockerfile: services/route-engine/Dockerfile
        environment:
            ROUTE_ENGINE_LISTEN_ADDRESS: 0.0.0.0:50051
            GRAPHHOPPER_URL: http://graphhopper:8989/
        depends_on:
            graphhopper:
                condition: service_healthy
        restart: unless-stopped

    graphhopper:
        build:
            context: deploy/graphhopper
            dockerfile: Dockerfile
        environment:
            JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xms1g -Xmx4g}
        volumes:
            - ./data:/data/source:ro
            - graphhopper-graph:/data/graph-cache
            - graphhopper-elevation:/data/srtm
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8989;
                    printf "GET /info HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
                    grep -q "200 OK" <&3'
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        restart: unless-stopped

    postgres-postgis:
        image: postgis/postgis:16-3.4-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-runroute}
            POSTGRES_USER: ${POSTGRES_USER:-runroute}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runroute}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-runroute} -d ${POSTGRES_DB:-runroute}',
                ]
            interval: 5s
            timeout: 3s
            retries: 12
        restart: unless-stopped

volumes:
    postgres-data:
    graphhopper-graph:
    graphhopper-elevation:
