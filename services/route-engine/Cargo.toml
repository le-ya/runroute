[package]
name = "route-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[dependencies]
prost = "=0.13.3"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
tokio = { version = "=1.41.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tonic = "=0.12.3"
url = "=2.5.4"

[build-dependencies]
protoc-bin-vendored = "=3.1.0"
tonic-build = "=0.12.3"
