[package]
name = "runroute"
version = "0.2.0"
edition = "2021"
authors = ["Yannick <le-ya>"]
description = "Fast trail route generator for Lyon & Monts d'Or in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rayon = "1.10"
quick-xml = "0.36"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
hashbrown = { version = "0.14", features = ["rayon", "serde"] }
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
